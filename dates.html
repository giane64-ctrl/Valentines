<!DOCTYPE html>

<title>Our Dates 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:20px;
  font-family:'Pacifico',cursive;
  background:linear-gradient(180deg,#ffd6e8,#ffeaf3);
}
#fade{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#ffd6e8,#ffeaf3);
  animation:fadeIn .3s ease forwards;
  pointer-events:none;
  z-index:9999;
}
@keyframes fadeIn{from{opacity:1}to{opacity:0}}
.fade-out{animation:fadeOut .8s ease forwards}
@keyframes fadeOut{from{opacity:0}to{opacity:1}}

a{
  text-decoration:none;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,102,163,.75);
  color:white;
  transition:.15s;
}
a:active{transform:scale(.95)}

.card{
  margin-top:20px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:14px;
  box-shadow:0 18px 35px rgba(255,0,120,.2);
}
img{width:100%;border-radius:14px}
.caption{margin-top:10px;color:#7a003c}
</style>
</head>

<body>
<div id="fade"></div>

<a href="moments.html">⬅ Back</a>
