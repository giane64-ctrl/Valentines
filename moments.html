<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Moments 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  padding:20px;
  font-family:'Pacifico',cursive;
  background:linear-gradient(180deg,#ffeaf3,#ffd6e8);
}
#fade{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#ffeaf3,#ffd6e8);
  animation:fadeIn .3s ease forwards;
  pointer-events:none;
  z-index:9999;
}
@keyframes fadeIn{from{opacity:1}to{opacity:0}}
.fade-out{animation:fadeOut .8s ease forwards}
@keyframes fadeOut{from{opacity:0}to{opacity:1}}

a{
  display:block;
  padding:16px;
  margin-bottom:14px;
  border-radius:18px;
  color:white;
  text-decoration:none;
  background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,102,163,.75));
  box-shadow:0 15px 30px rgba(255,0,120,.25);
  transition:.15s;
}
a:active{transform:scale(.95)}
</style>
</head>

<body>
<div id="fade"></div>

<a href="index.html">⬅ Back</a>
<a href="dates.html">🌹 Dates</a>
<a href="random.html">🎈 Random</a>
<a href="favorites.html">⭐ Favorites</a>

<script>
document.querySelectorAll("a").forEach(link=>{
  link.onclick=e=>{
    e.preventDefault();
    fade.classList.add("fade-out");
    setTimeout(()=>location.href=link.href,800);
  };
});
</script>
</body>
</html>
