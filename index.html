<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine’s day babee ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:'Pacifico',cursive;
  background:linear-gradient(180deg,#ffd6e8,#ffeaf3);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow:hidden;
}


#fade{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#ffd6e8,#ffeaf3);
  z-index:9999;
  animation:fadeIn 10s ease forwards;
  pointer-events:none;
}
@keyframes fadeIn{from{opacity:1}to{opacity:0}}
.fade-out{animation:fadeOut .8s ease forwards}
@keyframes fadeOut{from{opacity:0}to{opacity:1}}

.flowers{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}
.flower{
  position:absolute;
  bottom:-12%;
  opacity:0;
  animation:floatUp linear forwards;
  filter:blur(.3px);
}
@keyframes floatUp{
  0%{
    transform:translateY(0) translateX(0) rotate(0deg);
    opacity:0;
  }
  10%{opacity:.65}
  100%{
    transform:translateY(-130vh) translateX(var(--drift)) rotate(360deg);
    opacity:0;
  }
}

/* CARD */
.card{
  width:100%;
  max-width:380px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:18px;
  box-shadow:0 20px 40px rgba(255,0,120,.25);
  position:relative;
  z-index:2;
}

/* HEADING */
.heading{
  text-align:center;
  font-size:1.6rem;
  color:#a1004f;
  margin-bottom:10px;
  text-shadow:0 4px 10px rgba(255,0,120,.35);
  animation:softFloat 4s ease-in-out infinite;
}
@keyframes softFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* VIDEO */
video{
  width:100%;
  border-radius:16px;
}

/* TYPING */
.handwriting{
  margin-top:12px;
  font-size:1.05rem;
  color:#7a003c;
  min-height:120px;
}
.cursor{
  display:inline-block;
  width:2px;
  height:1.2em;
  background:#7a003c;
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0}}

/* BUTTON */
.buttons{
  margin-top:12px;
  display:flex;
  flex-direction:column;
}
.buttons a{
  text-decoration:none;
  text-align:center;
  padding:14px;
  border-radius:16px;
  color:white;
  background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,102,163,.75));
  box-shadow:0 18px 35px rgba(255,0,120,.25);
  transition:.15s;
}
.buttons a:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<div id="fade"></div>
<div class="flowers"></div>

<!-- BACKGROUND MUSIC -->
<audio id="bgMusic" autoplay muted loop playsinline>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<div class="card">

  <!-- 💖 HEADING -->
  <div class="heading">Happy Valentine’s Day, Babe ❤️</div>

  <video autoplay muted loop playsinline>
    <source src="assets/intro.mp4">
  </video>

  <div class="handwriting">
    <span id="text"></span><span class="cursor"></span>
  </div>

  <div class="buttons">
    <a href="moments.html">💞 Our Moments</a>
  </div>
</div>

<script>
/* TYPING EFFECT */
const message = `This little place holds our memories,
our love,
and everything I feel for you ❤️`;
let i=0;
const textEl=document.getElementById("text");
(function type(){
  if(i<message.length){
    textEl.innerHTML+=message.charAt(i++);
    setTimeout(type,60);
  }
})();

/* PAGE TRANSITION */
document.querySelectorAll("a").forEach(link=>{
  link.onclick=e=>{
    e.preventDefault();
    fade.classList.add("fade-out");
    setTimeout(()=>location.href=link.href,800);
  };
});

/* CONTINUOUS RANDOM FLOWERS */
const flowerContainer=document.querySelector(".flowers");
const flowerEmojis=["🌸","🌷","🌼","💮","🌹"];

function createFlower(){
  const f=document.createElement("div");
  f.className="flower";
  f.textContent=flowerEmojis[Math.floor(Math.random()*flowerEmojis.length)];

  const size=Math.random()*22+16;
  const left=Math.random()*100;
  const duration=Math.random()*10+16;
  const drift=(Math.random()*80-40)+"px";

  f.style.fontSize=size+"px";
  f.style.left=left+"vw";
  f.style.animationDuration=duration+"s";
  f.style.setProperty("--drift",drift);

  flowerContainer.appendChild(f);
  setTimeout(()=>f.remove(),duration*1000);
}
setInterval(createFlower,900);

/* MUSIC AUTOPLAY UNLOCK */
const music=document.getElementById("bgMusic");
let unlocked=false;
music.volume=0;
music.play().catch(()=>{});

function unlockAudio(){
  if(unlocked) return;
  unlocked=true;
  music.muted=false;
  music.play();
  let v=0;
  const fade=setInterval(()=>{
    if(v<0.6){
      v+=0.02;
      music.volume=v;
    }else clearInterval(fade);
  },150);
}
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("touchstart",unlockAudio,{once:true});
</script>

</body>
</html>
